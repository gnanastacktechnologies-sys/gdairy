services:
  # GDairy Fullstack Service (Backend API + React Frontend)
  - type: web
    name: gdairy
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Gnanasekaran
      - key: ADMIN_PASSWORD
        value: Gnana123@
      - key: ADMIN_NAME
        value: Gnanasekaran
